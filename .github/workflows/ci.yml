name: Python CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: ruff check .

      - name: Run tests
        run: python -m pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
            docker build \
            -t ghcr.io/${{ github.actor }}/mini-ci-cd:latest \
            -t ghcr.io/${{ github.actor }}/mini-ci-cd:${{ github.sha }} .

      - name: Push Docker image
        run: |
            docker push ghcr.io/${{ github.actor }}/mini-ci-cd:latest
            docker push ghcr.io/${{ github.actor }}/mini-ci-cd:${{ github.sha }}

  deploy-development:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: development

    steps:
      - name: Trigger Render development deploy
        env:
          RENDER_DEV_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEV_DEPLOY_HOOK_URL }}
        run: |
            curl --fail --silent --show-error -X POST "$RENDER_DEV_DEPLOY_HOOK_URL"

  smoke-test-development:
    needs: deploy-development
    runs-on: ubuntu-latest

    env:
      BASE_URL: https://mini-ci-cd-dev.onrender.com

    steps:
      - name: Check health endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            "$BASE_URL/healthz")

          echo "$response"
          echo "$response" | grep '"status":"ok"'

      - name: Check signal search endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            "$BASE_URL/signals/AAPL")

          echo "$response"
          echo "$response" | grep '"ticker":"AAPL"'
          echo "$response" | grep '"signal"'
          echo "$response" | grep '"timestamp"'

  deploy-production:
    runs-on: ubuntu-latest
    needs: smoke-test-development
    environment: production

    steps:
      - name: Fake deploy to production
        run: |
            echo "Deploying to production..."
            echo "ghcr.io/${{ github.actor }}/mini-ci-cd:${{ github.sha }}"
            echo "Production Deployment complete"
